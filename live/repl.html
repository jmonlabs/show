<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JMON Live REPL</title>
  <style>
    /* Monaspace Radon — GitHub Next's handwriting-flavored monospace, served
       from jsDelivr's GitHub passthrough. Pinned to v1.101. If the network
       request fails, the font-family fallback chain still resolves to a
       system monospace. */
    @font-face {
      font-family: 'Monaspace Radon';
      src: url('https://cdn.jsdelivr.net/gh/githubnext/monaspace@v1.101/fonts/webfonts/MonaspaceRadon-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* --- Palette (logo-derived greens + warm cream + salmon accent) -----
       --bg          background, body chrome
       --surface     panels, buttons, editor pane
       --border      subtle dividers
       --text        primary text (warm cream)
       --text-mute   secondary text (desaturated taupe)
       --accent      primary accent (logo salmon)
       --accent-hi   secondary accent (paler salmon, hover/highlight)
       The syntax-highlight tokens below are read by the CodeMirror theme
       (see EditorView.theme + HighlightStyle.define in the script below)
       through CSS custom properties — edit the palette in one place and the
       editor follows. */
    :root {
      --bg:        #3D4F42;
      --surface:   #344038;
      --border:    #4A5C50;
      --text:      #E8DDD2;
      --text-mute: #A89B8E;
      --accent:    #CB9886;
      --accent-hi: #D9B5A3;
      --syn-kw:    #E8B4A0;
      --syn-str:   #B8C9A8;
      --syn-num:   #D4C896;
      --syn-cmt:   #6B7D70;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Monaspace Radon', 'Monaco', 'Courier New', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .beat { font-size: 16px; min-width: 150px; color: var(--accent); white-space: pre; }
    .header h2 {
      font-size: 14px;
      color: var(--accent);
      letter-spacing: 2px;
      margin-right: auto;
    }
    button, select {
      font-family: inherit;
      font-size: 12px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: 3px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button:hover, select:hover {
      background: var(--border);
      border-color: var(--accent-hi);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    select { padding: 3px 6px; }
    .status {
      color: var(--accent);
      font-size: 11px;
      padding: 2px 6px;
      border: 1px dashed var(--accent);
      border-radius: 3px;
    }
    .body {
      display: grid;
      grid-template-columns: 1fr 360px;
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 800px) {
      .body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    }
    /* CodeMirror host — fills the editor pane. The internal CM classes
       (.cm-editor / .cm-scroller / .cm-gutters) are themed in JS via
       EditorView.theme(); these rules just handle layout + font. */
    #code-host {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .cm-editor {
      height: 100%;
      font-family: 'Monaspace Radon', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.45;
      outline: none;
    }
    .cm-editor.cm-focused {
      outline: none;
    }
    .cm-scroller {
      font-family: inherit;
    }
    .player-pane {
      background: var(--bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: var(--bg);
    }
    .hint {
      padding: 8px 12px;
      font-size: 11px;
      color: var(--text-mute);
      border-top: 1px solid var(--border);
    }
    kbd {
      background: var(--surface);
      color: var(--accent);
      padding: 1px 5px;
      border-radius: 2px;
      border: 1px solid var(--border);
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>JMON LIVE REPL</h2>
    <button id="run">Run <kbd>Ctrl/Cmd+Enter</kbd></button>
    <button id="stop">Stop</button>
    <button id="reset">Reset</button>
    <label>mode
      <select id="mode">
        <option value="next-loop" selected>next-loop</option>
        <option value="next-bar">next-bar</option>
        <option value="immediate">immediate</option>
      </select>
    </label>
    <button id="midi">Enable MIDI</button>
    <select id="midi-out" title="MIDI output"></select>
    <button id="load-demo" title="Load drums + drone + violin walk demo">Load demo</button>
    <span class="status" id="status">waiting</span>
  </div>
  <div class="header">
    <label>keys play <select id="keys" title="The track the keys play"></select></label>
    <label>pads play <select id="pads" title="The track the pads play (MIDI channel 10)"></select></label>
    <button id="rec" title="With nothing playing: start, then stop to set the loop. Over a loop: add a layer">Rec</button>
    <button id="undo" title="Take away the last layer">Undo</button>
    <label>grid
      <select id="grid" title="Snap the recorded notes">
        <option value="0" selected>off</option>
        <option value="0.5">1/8</option>
        <option value="0.25">1/16</option>
      </select>
    </label>
    <button id="pedal" title="Press, then hit a pad: that pad starts and stops recording">Pedal: none</button>
    <span class="beat" id="beat" title="The beat in the bar, and the bar in the loop">····</span>
    <label title="Hear the beat"><input type="checkbox" id="click"> click</label>
    <span class="status" id="midi-in" title="The last MIDI message heard">no MIDI in</span>
  </div>
  <div class="body">
    <div id="code-host"></div>
    <div class="player-pane">
      <iframe id="player" allow="midi"></iframe>
      <div class="hint">
        Click the player once to enable audio.<br>
        For MIDI to a DAW, enable a virtual MIDI port (IAC on macOS,
        loopMIDI on Windows, snd-virmidi on Linux), click Enable MIDI,
        then pick it from the dropdown.
      </div>
    </div>
  </div>

  <script type="module">
    // CodeMirror 6 — small editor with JS syntax highlighting. Loaded as ESM
    // from esm.sh (same pattern as everywhere else in this project). Pinned
    // to major versions; CM6 ecosystem packages within the same major are
    // interoperable, so esm.sh's module dedup handles cross-package sharing.
    import { EditorView, keymap, lineNumbers, highlightActiveLine }
      from "https://esm.sh/@codemirror/view@6";
    import { EditorState } from "https://esm.sh/@codemirror/state@6";
    import { javascript } from "https://esm.sh/@codemirror/lang-javascript@6";
    import { HighlightStyle, syntaxHighlighting, bracketMatching, indentOnInput }
      from "https://esm.sh/@codemirror/language@6";
    import { defaultKeymap, history, historyKeymap }
      from "https://esm.sh/@codemirror/commands@6";
    import { closeBrackets } from "https://esm.sh/@codemirror/autocomplete@6";
    import { tags as t } from "https://esm.sh/@lezer/highlight@1";

    const playerEl = document.getElementById("player");
    const statusEl = document.getElementById("status");
    const modeEl = document.getElementById("mode");
    const midiOutEl = document.getElementById("midi-out");
    const keysEl = document.getElementById("keys");
    const recEl = document.getElementById("rec");
    const gridEl = document.getElementById("grid");
    const padsEl = document.getElementById("pads");
    const pedalEl = document.getElementById("pedal");
    const midiInEl = document.getElementById("midi-in");
    const beatEl = document.getElementById("beat");
    const clickEl = document.getElementById("click");
    // `?local` goes on to the player: it then plays show, io and sound from this disk.
    playerEl.src = "index.html" + location.search;
    const codeHost = document.getElementById("code-host");

    let playerReady = false;
    // Persisted between runs so user code can keep state across re-evals:
    //   scope.step = (scope.step ?? 0) + 1
    const scope = {};

    function setStatus(s) { statusEl.textContent = s; }

    function send(msg) {
      if (!playerReady) {
        setStatus("player not ready yet");
        return;
      }
      playerEl.contentWindow.postMessage(msg, "*");
    }

    // --- Editor setup ----------------------------------------------------
    let STARTER_BUFFER = ""; // loaded from starter.txt
    let DEMO_BUFFER = "";    // loaded from demo.txt

    // Theme + syntax tokens read directly from the CSS custom properties on
    // :root, so editing the palette in <style> ripples into the editor.
    const palette = EditorView.theme({
      "&": {
        backgroundColor: "var(--surface)",
        color: "var(--text)",
        height: "100%"
      },
      ".cm-content": { caretColor: "var(--accent)", padding: "14px 0" },
      ".cm-cursor, .cm-dropCursor": { borderLeftColor: "var(--accent)" },
      "&.cm-focused .cm-selectionBackground, .cm-selectionBackground, ::selection":
        { backgroundColor: "var(--border)" },
      ".cm-gutters": {
        backgroundColor: "var(--surface)",
        color: "var(--text-mute)",
        border: "none"
      },
      ".cm-activeLine": { backgroundColor: "transparent" },
      ".cm-activeLineGutter": { backgroundColor: "transparent", color: "var(--accent)" },
      ".cm-matchingBracket, .cm-nonmatchingBracket": {
        backgroundColor: "transparent",
        color: "var(--accent-hi)",
        outline: "1px solid var(--border)"
      }
    }, { dark: true });

    const tokens = HighlightStyle.define([
      { tag: t.keyword, color: "var(--syn-kw)" },
      { tag: [t.string, t.regexp, t.special(t.string)], color: "var(--syn-str)" },
      { tag: [t.number, t.bool, t.null], color: "var(--syn-num)" },
      { tag: [t.comment, t.lineComment, t.blockComment, t.docComment],
        color: "var(--syn-cmt)", fontStyle: "italic" },
      { tag: t.propertyName, color: "var(--text)" },
      { tag: [t.variableName, t.definition(t.variableName)], color: "var(--text)" },
      { tag: t.operator, color: "var(--accent)" },
      { tag: [t.bracket, t.paren, t.brace, t.squareBracket], color: "var(--text-mute)" }
    ]);

    const view = new EditorView({
      parent: codeHost,
      state: EditorState.create({
        doc: "",
        extensions: [
          // The editor is kept in this browser as you type: a reload, or a
          // swipe back on the trackpad, gives it back.
          EditorView.updateListener.of((update) => {
            if (update.docChanged) localStorage.setItem("jmon-live-repl", update.state.doc.toString());
          }),
          lineNumbers(),
          highlightActiveLine(),
          history(),
          bracketMatching(),
          closeBrackets(),
          indentOnInput(),
          javascript(),
          syntaxHighlighting(tokens),
          palette,
          keymap.of([
            { key: "Mod-Enter", run: () => { run(); return true; }, preventDefault: true },
            ...defaultKeymap,
            ...historyKeymap
          ])
        ]
      })
    });

    function getCode() { return view.state.doc.toString(); }
    function setCode(text) {
      view.dispatch({
        changes: { from: 0, to: view.state.doc.length, insert: text }
      });
    }

    // The keyboard takes, written at the top of the editor between two marker
    // lines, so the code below can use them (`notes: recorded.cello.notes`).
    let recording = false;
    const layers = []; // what `recorded` was before each take, for Undo
    const takesStart = "// Keyboard takes (rewritten after each take).";
    const takesEnd = "// End of keyboard takes.";
    function writeTakes() {
      const line = (o) => JSON.stringify(o).replace(/"(\w+)":/g, "$1: ").replace(/,(?=\S)/g, ", ").replace(/^\{/, "{ ").replace(/\}$/, " }");
      const tracks = Object.entries(scope.recorded).map(([label, t]) =>
        `  ${JSON.stringify(label)}: {\n${t.loop ? `    loop: ${t.loop},\n` : ""}    notes: [\n${t.notes.map((n) => "      " + line(n) + ",\n").join("")}    ],\n` +
        `    cc: [\n${(t.cc || []).map((c) => "      " + line(c) + ",\n").join("")}    ],\n  },\n`).join("");
      const block = `${takesStart}\nrecorded = {\n${tracks}};\n${takesEnd}\n`;
      const code = getCode();
      const from = code.indexOf(takesStart);
      const to = code.indexOf(takesEnd);
      if (from >= 0 && to > from) {
        view.dispatch({ changes: { from, to: Math.min(code.length, to + takesEnd.length + 1), insert: block } });
      } else {
        view.dispatch({ changes: { from: 0, to: 0, insert: block + "\n" } });
      }
    }

    const AsyncFunction = (async function () {}).constructor;

    // Leaving the page stops the music: ask first once something is playing.
    window.addEventListener("beforeunload", (event) => { if (playerReady && scope.pattern) event.preventDefault(); });

    async function run() {
      const code = getCode();
      // Pre-seed scope.pattern so a bare `pattern = {...}` inside `with(scope)`
      // lands on scope (rather than creating a global). AsyncFunction bodies
      // are sloppy mode, so `with` is allowed and user code can `await`.
      scope.pattern = undefined;
      scope.recorded ??= {}; // the keyboard takes, so a bare `recorded = {...}` lands here too
      try {
        const fn = new AsyncFunction("scope", "with (scope) {\n" + code + "\n}");
        await fn(scope);
      } catch (err) {
        console.error(err);
        setStatus("error: " + err.message);
        return;
      }
      const pattern = scope.pattern;
      if (!pattern) {
        setStatus("no `pattern` assigned");
        return;
      }
      send({ type: "update", pattern, mode: modeEl.value });
      setStatus("sent (" + modeEl.value + ")");
      // The tracks the keys and the pads can play.
      const labels = (pattern.tracks || []).map((track) => track.label || "_default");
      for (const [el, first] of [[keysEl, null], [padsEl, "with the keys"]]) {
        const chosen = el.value;
        el.innerHTML = "";
        for (const label of first ? ["", ...labels] : labels) {
          const opt = document.createElement("option");
          opt.value = label;
          opt.textContent = label || first;
          el.appendChild(opt);
        }
        if ([...el.options].some((o) => o.value === chosen)) el.value = chosen;
      }
      send({ type: "setKeyboardTrack", label: keysEl.value });
      send({ type: "setPadsTrack", label: padsEl.value });
      send({ type: "setGrid", grid: Number(gridEl.value) });
    }

    window.addEventListener("message", (event) => {
      const data = event.data || {};
      if (data.type === "ready") {
        playerReady = true;
        setStatus("ready (click player to enable audio)");
      } else if (data.type === "loop") {
        setStatus("loop " + data.iteration + " @ beat " + data.beat);
      } else if (data.type === "recording") {
        recording = data.on;
        recEl.textContent = data.on ? "Stop rec" : "Rec";
        if (data.on) {
          layers.push(JSON.parse(JSON.stringify(scope.recorded ?? {})));
          setStatus(data.loop ? "recording a layer over the loop" : "recording: stop to set the loop");
        } else {
          setStatus("take written at the top of the editor");
        }
      } else if (data.type === "take") {
        const before = layers.at(-1)?.[data.label] ?? { notes: [], cc: [] };
        scope.recorded ??= {};
        scope.recorded[data.label] = {
          ...(data.loop || before.loop ? { loop: data.loop || before.loop } : {}),
          notes: [...before.notes, ...data.notes],
          cc: [...(before.cc || []), ...data.cc],
        };
        writeTakes();
      } else if (data.type === "beat") {
        // ● the beat now, · the others; then which bar of the loop
        const dots = Array.from({ length: data.beats }, (_, k) => (k === data.beat ? "●" : "·")).join(" ");
        beatEl.textContent = dots + (data.bars ? `   bar ${data.bar} of ${data.bars}` : "");
      } else if (data.type === "midiIn") {
        midiInEl.textContent = data.text;
      } else if (data.type === "pedal") {
        pedalEl.textContent = "Pedal: " + data.text;
      } else if (data.type === "midi") {
        const info = data.info || {};
        midiOutEl.innerHTML = "";
        for (const name of (info.outputs || [])) {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          if (name === info.selected) opt.selected = true;
          midiOutEl.appendChild(opt);
        }
        const inputs = (info.inputs || []).length ? "keyboard: " + info.inputs.join(", ") : "no keyboard";
        const output = (info.outputs || []).length ? "out: " + info.selected : "no MIDI out";
        setStatus(inputs + " · " + output);
      }
    });

    async function fetchBuffers() {
      // Load starter buffer first so the editor gets meaningful content.
      try {
        const r = await fetch('starter.txt');
        if (r.ok) {
          STARTER_BUFFER = await r.text();
          // only replace the editor if it's empty or contains the original placeholder
          const cur = getCode().trim();
          const saved = localStorage.getItem("jmon-live-repl");
          if (!cur) setCode(saved?.trim() ? saved : STARTER_BUFFER);
        } else {
          console.warn('starter.txt fetch failed:', r.status);
        }
      } catch (e) {
        console.warn('failed to fetch starter.txt', e);
      }

      try {
        const r2 = await fetch('demo.txt');
        if (r2.ok) DEMO_BUFFER = await r2.text();
        else console.warn('demo.txt fetch failed:', r2.status);
      } catch (e) {
        console.warn('failed to fetch demo.txt', e);
      }
    }

    // Prefetch buffers but don't block editor creation.
    fetchBuffers();

    function loadDemo() {
      const cur = getCode().trim();
      const defaultStarter = cur.startsWith("// Edit, then Ctrl/Cmd+Enter");
      if (cur && !defaultStarter && cur !== DEMO_BUFFER.trim()) {
        if (!confirm("Replace the current buffer with the demo?")) return;
      }
      if (DEMO_BUFFER) {
        setCode(DEMO_BUFFER);
        setStatus("demo loaded — Enable MIDI, then Run");
      } else {
        // Fallback: attempt to fetch on demand
        fetch('demo.txt').then(r => r.text()).then(text => {
          DEMO_BUFFER = text;
          setCode(DEMO_BUFFER);
          setStatus("demo loaded — Enable MIDI, then Run");
        }).catch((e) => {
          console.warn('failed to load demo on demand', e);
          setStatus("failed to load demo");
        });
      }
    }

    document.getElementById("run").addEventListener("click", run);
    document.getElementById("stop").addEventListener("click", () => send({ type: "stop" }));
    document.getElementById("reset").addEventListener("click", () => send({ type: "reset" }));
    document.getElementById("midi").addEventListener("click", () => send({ type: "enableMidi" }));
    document.getElementById("load-demo").addEventListener("click", loadDemo);
    keysEl.addEventListener("change", () => send({ type: "setKeyboardTrack", label: keysEl.value }));
    recEl.addEventListener("click", () => send(recording ? { type: "stopRecord" } : { type: "record" }));
    padsEl.addEventListener("change", () => send({ type: "setPadsTrack", label: padsEl.value }));
    clickEl.addEventListener("change", () => send({ type: "setClick", on: clickEl.checked }));
    gridEl.addEventListener("change", () => send({ type: "setGrid", grid: Number(gridEl.value) }));
    pedalEl.addEventListener("click", () => { pedalEl.textContent = "Pedal: hit a pad…"; send({ type: "learnPedal" }); });
    // Undo: `recorded` as it was before the last take, and the player follows.
    document.getElementById("undo").addEventListener("click", () => {
      if (recording || !layers.length) return;
      scope.recorded = layers.pop();
      writeTakes();
      run();
    });
    midiOutEl.addEventListener("change", (e) => {
      if (e.target.value) send({ type: "setMidiOutput", output: e.target.value });
    });

    // Ctrl/Cmd+Enter is wired through the CodeMirror keymap above; no extra
    // window-level shortcut is needed.
  </script>
</body>
</html>
