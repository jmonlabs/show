<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JMON Live Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div>
    <h2>JMON LIVE PLAYER</h2>
    <button id="enable-audio" type="button">Click to enable audio</button>
    <div>Status: <span id="status">initializing…</span></div>
    <div>Pattern length: <span id="pattern-length">0</span></div>
    <div>Events played: <span id="events-played">0</span></div>
    <div>Position: <span id="position">0</span></div>
  </div>

  <script type="module" src="https://cdn.jsdelivr.net/gh/jmonlabs/show@main/src/live/player.js"></script>
</body>
</html>
